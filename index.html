        }
        
        .logo-container img { height: 60px; width: auto; display: block; }
        
        h1 {
            color: #23004C;
            font-weight: bold;
            line-height: 1.4;
            flex-grow: 1;
        }
        
        .toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .toggle-btn {
            background-color: #F4F2F6;
            border: 2px solid #23004C;
            color: #23004C;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .toggle-btn:first-child { border-radius: 5px 0 0 5px; }
        .toggle-btn:not(:first-child):not(.dropdown-btn) { border-left: none; }
        .toggle-btn.active { background-color: #23004C; color: white; }
        
        /* Dropdown styles */
        .dropdown-container {
            position: relative;
            display: inline-block;
            border-left: none;
        }
        
        .dropdown-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 150px;
            border-radius: 0 5px 5px 0;
        }
        
        .dropdown-arrow {
            margin-left: 8px;
            font-size: 10px;
            transition: transform 0.3s;
        }
        
        .dropdown-btn.active .dropdown-arrow {
            transform: rotate(180deg);
        }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 150px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1000;
            border-radius: 5px;
            margin-top: 2px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .dropdown-menu.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            color: #23004C;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .dropdown-item:first-child {
            border-radius: 5px 5px 0 0;
        }
        
        .dropdown-item:last-child {
            border-radius: 0 0 5px 5px;
        }
        
        .dropdown-item:hover {
            background-color: #F4F2F6;
        }
        
        .dropdown-item.active {
            background-color: #23004C;
            color: white;
            font-weight: bold;
        }
        
        .section {
            margin-bottom: 40px;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(35, 0, 76, 0.1);
            overflow-x: auto;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
            flex-wrap: wrap;
        }

        .legend-btn {
            display: flex;
            align-items: center;
            padding: 10px 18px;
            border: 2px solid #23004C;
            background-color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 14px;
        }

        .legend-btn:hover {
            background-color: #F4F2F6;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(35, 0, 76, 0.15);
        }

        .legend-btn.active {
            background-color: #23004C;
            color: white;
            box-shadow: 0 4px 12px rgba(35, 0, 76, 0.3);
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            margin-right: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .legend-label {
            white-space: nowrap;
        }

        .legend-counter {
            background-color: rgba(35, 0, 76, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
            font-weight: bold;
        }

        .legend-btn.active .legend-counter {
            background-color: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .legend-btn[data-filter="all"] {
            background-color: #F4F2F6;
            font-weight: bold;
        }

        .legend-btn[data-filter="all"].active {
            background-color: #23004C;
        }
        
        table { width: 100%; border-collapse: collapse; }
        
        th {
            background-color: #23004C;
            color: white;
            font-weight: bold;
            padding: 12px 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        
        td {
            padding: 8px 4px 8px 8px;
            text-align: left;
            border: 1px solid #ddd;
            font-weight: bold;
            font-size: 12px;
        }
        
        tbody td:nth-child(-n+4) { color: #7A00E6; }
        
        .category-title-row { background-color: #F4F2F6 !important; }
        .category-title-row td {
            color: #23004C !important;
            font-size: 20px;
            font-weight: 500;
            padding: 20px 15px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .category-even { background-color: #FFFFFF; }
        .category-odd { background-color: #F4F2F6; }
        tr:hover td { background-color: rgba(122, 0, 230, 0.1) !important; }
        
        tbody tr {
            transition: opacity 0.3s ease;
        }
        
        .timeline-header { text-align: center; padding: 12px 5px; }
        .timeline-cell {
            padding: 0;
            position: relative;
            background-color: #f9f9f9;
            min-width: 400px;
        }
        
        .timeline-bar-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 3px;
        }
        
        .timeline-bar-container {
            position: relative;
            width: 100%;
            height: 16px;
            background-color: #e0e0e0;
            border-radius: 2px;
            display: flex;
        }
        
        .timeline-bar {
            height: 100%;
            cursor: pointer;
            position: relative;
        }
        
        .standard-support { background-color: #2ecc71; }
        .extended-support { background-color: #f39c12; }
        .end-of-support { background-color: #e74c3c; }
        
        .year-headers { display: flex; width: 100%; height: 100%; }

            flex: 1;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
        }
        .year-header:last-child { border-right: none; }

            position: fixed;
            background-color: #23004C;
            color: white;

            border-radius: 4px;
            font-size: 12px;
            z-index: 100000;
            pointer-events: none;

            display: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);

            h1 { text-align: center; margin-bottom: 20px; }

            .legend { gap: 8px; }

        const siteMapping = {

            // ADD MORE SITES HERE AS NEEDED

        // ============================================================================
        // CONFIGURATION AND UTILITY FUNCTIONS
        // ============================================================================
        const config = {
            startDate: new Date('2025-01-01'),
            endDate: new Date('2031-12-31'),
            get totalDays() {
                return (this.endDate - this.startDate) / (1000 * 60 * 60 * 24);
            }
        };

        const parseDate = (dateString) => 
            dateString && !dateString.includes('Not yet') ? new Date(dateString) : null;

        const formatDate = (date) => 
            date ? new Date(date).toLocaleDateString('en-US', { 
                month: '2-digit', 
                day: '2-digit', 
                year: 'numeric' 
            }) : null;

        const calculateWidth = (startDate, endDate) => 
            ((endDate - startDate) / (1000 * 60 * 60 * 24) / config.totalDays) * 100;

        const createTimelineBar = (type, width, tooltip) => 
            `<div class="timeline-bar ${type}" style="width: ${width}%;" data-tooltip="${tooltip}"></div>`;

        // Function to determine support status
        const getSupportStatus = (component) => {
            const now = new Date();
            const standardEnd = parseDate(component.endOfStandardSupport);
            const extendedEnd = parseDate(component.endOfExtendedSupport);
            
            if (!component.endOfExtendedSupport || component.endOfExtendedSupport.includes('Not yet')) {
                return 'supported';
            }
            
            if (standardEnd && standardEnd > now) {
                return 'supported';
            }
            
            if (!standardEnd && extendedEnd) {
                if (extendedEnd > now) {
                    return 'extended';
                } else {
                    return 'unsupported';
                }
            }
            
            if (extendedEnd && extendedEnd > now) {
                return 'extended';
            }
            
            return 'unsupported';
        };

        const createTimeline = (component) => {
            const { endOfStandardSupport, endOfExtendedSupport } = component;
            const isNotAnnounced = !endOfExtendedSupport || endOfExtendedSupport.includes('Not yet');
            
            if (isNotAnnounced) {
                return createTimelineBar('standard-support', 100, 'End of Standard Support is not yet announced');
            }

            const standardEnd = parseDate(endOfStandardSupport);
            const extendedEnd = parseDate(endOfExtendedSupport);
            let timeline = '';
            let currentDate = config.startDate;

            if (standardEnd && standardEnd > config.startDate) {
                const width = calculateWidth(currentDate, standardEnd);
                timeline += createTimelineBar('standard-support', width, 
                    `Standard Support: until ${formatDate(endOfStandardSupport)}`);
                currentDate = standardEnd;
            } else if (!standardEnd && extendedEnd) {
                timeline += createTimelineBar('standard-support', 0, 
                    'End of Standard Support is not yet announced');
            } else if (!standardEnd && !extendedEnd) {
                return createTimelineBar('standard-support', 100, 
                    'End of Standard Support is not yet announced');
            }

            if (extendedEnd && extendedEnd > currentDate) {
                const width = calculateWidth(currentDate, extendedEnd);
                timeline += createTimelineBar('extended-support', width, 
                    `Extended Support: ${formatDate(currentDate)} - ${formatDate(endOfExtendedSupport)}`);
                currentDate = extendedEnd;
            }

            if (currentDate < config.endDate) {
                const width = calculateWidth(currentDate, config.endDate);
                timeline += createTimelineBar('end-of-support', width, 
                    `Out of Support after ${formatDate(currentDate)}`);
            }

            return timeline;
        };

        // ============================================================================
        // UPDATED: GET ALL COMPONENTS FOR A SITE ACROSS ALL SECTIONS
        // ============================================================================
        const getAllComponentsForSite = (site) => {
            if (site === 'all') {
                // Return all components from all sections
                const allComponents = [];
                Object.keys(data).forEach(sectionKey => {
                    if (data[sectionKey].components) {
                        data[sectionKey].components.forEach(comp => {
                            allComponents.push({...comp, section: sectionKey});
                        });
                    }
                });
                return allComponents;
            }

            // Get components for specific site across all sections
            const siteComponents = [];
            const siteMappingData = siteMapping[site];
            
            if (siteMappingData) {
                Object.keys(siteMappingData).forEach(sectionKey => {
                    const siteIds = siteMappingData[sectionKey] || [];
                    const sectionComponents = data[sectionKey]?.components || [];
                    
                    sectionComponents.forEach(comp => {
                        if (siteIds.includes(comp.id)) {
                            siteComponents.push({...comp, section: sectionKey});
                        }
                    });
                });
            }
            
            return siteComponents;

        // ============================================================================
        const renderTable = (section, filter = 'all', site = 'all') => {
            const tableBody = document.querySelector('tbody');
            let components;

            if (site === 'all') {
                // Show only the selected section when no site filter is applied
                components = data[section]?.components || [];
            } else {
                // When a site is selected, get all components for that site across all sections
                // but still respect the section filter
                const allSiteComponents = getAllComponentsForSite(site);
                components = allSiteComponents.filter(comp => comp.section === section);
            }
            
            if (!components || components.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: #666;">No components found for the selected filters</td></tr>';
                
                // Update counters to 0
                document.querySelectorAll('.legend-btn').forEach(btn => {
                    const counterElement = btn.querySelector('.legend-counter');
                    if (counterElement) {
                        counterElement.textContent = '0';
                    }
                });
                return;
            }

            // Count items for each support status
            const counts = {
                all: components.length,
                supported: 0,
                extended: 0,
                unsupported: 0
            };

            components.forEach(comp => {
                const status = getSupportStatus(comp);
                counts[status]++;
            });

            // Update counter badges
            document.querySelectorAll('.legend-btn').forEach(btn => {
                const filterType = btn.dataset.filter;
                const counter = counts[filterType] || 0;
                const counterElement = btn.querySelector('.legend-counter');
                if (counterElement) {
                    counterElement.textContent = counter;
                }
            });

            // Filter components based on support status
            const filteredComponents = components.filter(comp => {
                if (filter === 'all') return true;
                const status = getSupportStatus(comp);
                return status === filter;
            });

            const grouped = filteredComponents.reduce((acc, comp) => {
                const category = comp.category || comp.subCategory || 'Unknown';
                (acc[category] = acc[category] || []).push(comp);
                return acc;
            }, {});

            // Only show categories that have items after filtering
            tableBody.innerHTML = Object.entries(grouped)
                .filter(([_, items]) => items.length > 0)
                .map(([category, items], idx) => {
                    const bgClass = idx % 2 === 0 ? 'category-even' : 'category-odd';

                                    </div>

        // ============================================================================

                    dropdownBtn.innerHTML = selectedSite === 'all' 
                        ? 'Sites <span class="dropdown-arrow">▼</span>' 
                        : `${selectedSite} <span class="dropdown-arrow">▼</span>`;
                    
                    // Close dropdown
                    document.getElementById('siteDropdownMenu').classList.remove('show');
                    dropdownBtn.classList.remove('active');
                    
                    // Update global site filter
                    window.currentSite = selectedSite;
                    
                    // Render table with new filters
                    renderTable(currentSection, currentFilter, selectedSite);
                });
            });
        };

        // ============================================================================
        // TOOLTIP FUNCTIONS
        // ============================================================================
        const updateTooltipPosition = (e, tooltip) => {
            const { offsetWidth: width, offsetHeight: height } = tooltip;
            const padding = 15;
            let left = e.clientX + padding;
            let top = e.clientY - height / 2;

            if (left + width > window.innerWidth) left = e.clientX - width - padding;
            if (top < 0) top = padding;
            if (top + height > window.innerHeight) top = window.innerHeight - height - padding;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
        };

        const attachTooltipListeners = () => {
            const tooltip = document.getElementById('tooltip');
            document.querySelectorAll('.timeline-bar').forEach(bar => {
                bar.addEventListener('mouseenter', (e) => {
                    const text = bar.getAttribute('data-tooltip');
                    if (text) {
                        tooltip.textContent = text;
                        tooltip.style.display = 'block';
                        updateTooltipPosition(e, tooltip);
                    }
                });
                bar.addEventListener('mousemove', (e) => updateTooltipPosition(e, tooltip));
                bar.addEventListener('mouseleave', () => tooltip.style.display = 'none');
            });
        };

        // ============================================================================
        // EVENT LISTENERS AND INITIALIZATION
        // ============================================================================
        document.addEventListener('DOMContentLoaded', () => {
            let currentSection = 'sharedInfrastructure';
            let currentFilter = 'all';
            let currentSite = 'all';
            
            // Make currentSite globally accessible
            window.currentSite = currentSite;
            
            // Populate site dropdown
            populateSiteDropdown();
            
            // Section toggle buttons
            document.querySelectorAll('.toggle-btn:not(.dropdown-btn)').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.toggle-btn:not(.dropdown-btn)').forEach(b => 
                        b.classList.remove('active'));
                    this.classList.add('active');
                    currentSection = this.dataset.section;
                    renderTable(currentSection, currentFilter, window.currentSite);
                });
            });

            // Legend filter buttons
            document.querySelectorAll('.legend-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.legend-btn').forEach(b => 
                        b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTable(currentSection, currentFilter, window.currentSite);
                });
            });
            
            // Dropdown toggle
            document.getElementById('siteDropdown').addEventListener('click', function(e) {
                e.stopPropagation();
                const menu = document.getElementById('siteDropdownMenu');
                menu.classList.toggle('show');
                this.classList.toggle('active');
            });
            
            // Close dropdown when clicking outside
            window.addEventListener('click', function() {
                const menu = document.getElementById('siteDropdownMenu');
                const btn = document.getElementById('siteDropdown');
                menu.classList.remove('show');
                btn.classList.remove('active');
            });

            // Initialize with first section and all items
            renderTable(currentSection, currentFilter, currentSite);
        });
    </script>
</body>
</html>
